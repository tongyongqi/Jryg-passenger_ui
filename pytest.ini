# 香港Android默认收集六个独立订单场景。
[pytest]
testpaths = cases
pythonpath = .
addopts = --import-mode=importlib
python_files = JRYG_test_android_*_order.py JRYG_test_android_v150_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = logs report screenshots data __pycache__ legacy Android-Tagent
