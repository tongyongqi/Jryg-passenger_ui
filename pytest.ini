# 香港Android默认收集独立订单场景及v1.5.0/v1.6.0用例。
[pytest]
testpaths = cases
pythonpath = .
addopts = --import-mode=importlib
python_files = JRYG_test_android_*_order.py JRYG_test_android_v150_*.py test_v150_*.py JRYG_test_android_v160_*.py test_v160_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = logs report screenshots data __pycache__ legacy Android-Tagent
