[pytest]
testpaths = cases
pythonpath = ..
python_files = JRYG_test_*.py test_*.py
python_classes = Test*
python_functions = test_*
addopts = -m "not capture and not e2e and not refund" --strict-markers
markers =
    capture: 基于显式抓包输入的接口断言，非默认在线接口回归
    e2e: HTTP、Socket、Redis 完整订单流程，需显式选择
    refund: 收银台退款接口（applyTradeRefund），需显式选择 --suite refund
norecursedirs = logs report data __pycache__
