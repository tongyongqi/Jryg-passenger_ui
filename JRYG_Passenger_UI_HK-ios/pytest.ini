# ==================== pytest 配置文件 ====================
# 港版 iOS 乘客端 UI 自动化 pytest 配置
# 默认cases目录运行真机订单；离线回归请显式指定tests目录，不混跑。
# cases/conftest.py排除旧银行卡兼容入口，避免目录扫描重复下单。
[pytest]
# 测试文件搜索路径：cases/ 目录
testpaths = cases
# Python 模块搜索路径：当前目录（JRYG_Passenger_UI_HK-ios）
pythonpath = .
# 导入模式：importlib（推荐，避免 __init__.py 冲突）
addopts = --import-mode=importlib
# cases收集JRYG_test_ios_*.py；显式指定tests时也完整收集test_*.py离线回归。
python_files = JRYG_test_ios_*.py test_*.py
# 测试类名匹配规则：Test* 开头的类
python_classes = Test*
# 测试方法名匹配规则：test_* 开头的方法
python_functions = test_*
# 排除目录：不递归进入这些目录搜索测试文件
norecursedirs = logs report screenshots data __pycache__ iOS-Tagent
