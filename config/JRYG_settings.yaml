# 香港Android配置，默认业务参数与已验证Android基线一致。
# 设备UDID明确指定当前已连接设备，不自动切换其他手机。
device:
  udid: "10AE6U20A7001H5"
  platform_name: "Android"
  platform_version: "15"
  device_name: "Android_Device"
  appium_host: "127.0.0.1"
  appium_port: 4723
  system_port: 8201
  session_create_timeout: 180
  request_timeout: 20
  uiautomator2_server_read_timeout: 15000
  disable_window_animation: true
  # 页面加载、搜索动画和地图持续变化，使用框架显式状态等待替代系统空闲等待。
  wait_for_idle_timeout: 0
  wait_for_selector_timeout: 0

driver:
  # auto按UDID是否相同决定shared/dual；shared顺序切换双App，dual须独立司机UDID。
  device_mode: "auto"
  # 留空复用乘客设备；双设备的UiAutomator2端口必须与乘客端不同。
  udid: ""
  system_port: 8202
  mobile: "11000005"
  fare: "5"
  surcharge: "0"
  passenger_tail: ""
  # 非目标测试单的打表金额与尾号独立配置，不套用目标单的环境变量覆盖值。
  # 包车只读取固定车费；现金未确认实收时停止，其他非目标单不代乘客付款。
  non_target_fare: "5"
  non_target_surcharge: "0"
  non_target_passenger_tail: ""
  non_target_cash_collected: false

login:
  country_code: "852"
  mobile: "11018258255"
  # 香港测试环境的11位测试账号；未配置时仍按8位香港号码校验。
  mobile_length: 11
  # 当前App的tv_mine_name固定显示4个星号加末4位，不代表号码被截断。
  account_mask_mode: "fixed_tail4"
  launch_timeout: 30
  timeout: 90

# Appium会话使用乘客包名/Activity；司机包由公共设备封装指定。
packages:
  passenger_hk: "com.sunlightmobility.client"
  passenger_hk_activity: "com.sunlightmobility.client.launcher.YGALoadingActivity"

order_validation:
  # 11000005司机在乘客接单页显示完整车牌TU7679，其中原生tv_car_number字段为U7679。
  expected_driver_phone: "11000005"
  expected_driver_car_number: "U7679"
  max_attempts: 5
  dispatch_timeout: 90
  state_timeout: 30
  completion_timeout: 90
  total_timeout: 900
  start_names: ["北角(地鐵站)", "北角地鐵站"]
  end_names: ["香港大學", "香港大学"]
  end_details: ["香港特別行政區中西區薄扶林道", "香港特别行政区中西区薄扶林道"]

# 港版测试环境 PolarDB（MySQL协议）连接配置。
# order_info 表位于 jryg_realtime_order_dev 库，存储 type5/type16 实时订单。
# type16 改造后 create 写入 payment_collection_mode、business_type 两字段。
database:
  host: "172.31.104.3"
  port: 3306
  user: "ygcx_test"
  password: "gJtF645DEIx+RMd2"
  charset: "utf8mb4"
  connect_timeout: 10
  read_timeout: 10
  # 实时订单库（type5即时单 + type16预约后付费单）
  realtime_db: "jryg_realtime_order_dev"
  order_info_table: "order_info"
  # 预约订单库（type6预约前付费单，对比验证不走此库）
  booking_db: "jryg_booking_order_dev"

# ==================== V1.6.0 网约车与预约业务配置 ====================
v160:
  # 版本准入：总开关 + 灰度（以 agent_id 为 scope、客户端版本为 condition）
  grayscale:
    enabled: true               # 新功能运行开关（全局总开关）
    scope_agent_ids: []         # 灰度渠道范围，空列表表示不限渠道
    min_client_version: "1.6.0" # 灰度客户端版本下限
  # 预约相关开关
  booking:
    # 车型选择页出发时间入口与首页预约入口共用同一开关
    departure_entry_enabled: true
    # 取消次数统计开关（capp.booking_cancel_limit_enabled）
    cancel_limit_enabled: true
    daily_cancel_limit: 5       # 当日预约取消次数上限
  # 预约时间范围（分钟）
  time_range:
    min_minutes: 30
    max_minutes: 4320           # 72 小时

# 车型配置（对应服务端 config.car_type）
# types 的顺序即车型排序；code 必须非空且唯一；
# 组合键 id+biz_mode+charge_mode 也必须唯一（出租车与网约车可复用同一 id）
car_type:
  types:
    - id: 1
      code: chartered_taxi
      biz_mode: 1               # 1=出租车
      charge_mode: 3            # 3=平台计费一口价
      icon: chartered_taxi_icon
    - id: 1
      code: taxi
      biz_mode: 1               # 1=出租车
      charge_mode: 4            # 4=线下打表
      icon: taxi_icon
      multi_pay_mode: true      # 仅 taxi 显式配置为 true
    - id: 1
      code: economy
      biz_mode: 2               # 2=网约车
      charge_mode: 3
      icon: economy_icon
    - id: 9
      code: preferred
      biz_mode: 2
      charge_mode: 3
      icon: preferred_icon
    - id: 2
      code: comfort
      biz_mode: 2
      charge_mode: 3
      icon: comfort_icon
    - id: 3
      code: business
      biz_mode: 2
      charge_mode: 3
      icon: business_icon
    - id: 4
      code: luxury
      biz_mode: 2
      charge_mode: 3
      icon: luxury_icon
  # 组合键 -> 车型编码映射（与 types 同级配置）
  # 未命中映射时使用相同组合键直接读取车型
  mapping:
    - id: 1
      biz_mode: 1
      charge_mode: 3
      code: chartered_taxi
    - id: 1
      biz_mode: 1
      charge_mode: 4
      code: taxi
    - id: 1
      biz_mode: 2
      charge_mode: 3
      code: economy
    - id: 9
      biz_mode: 2
      charge_mode: 3
      code: preferred
    - id: 2
      biz_mode: 2
      charge_mode: 3
      code: comfort
    - id: 3
      biz_mode: 2
      charge_mode: 3
      code: business
    - id: 4
      biz_mode: 2
      charge_mode: 3
      code: luxury
  # 车型图片资源
  images:
    economy: economy_car.png
    preferred: preferred_car.png
    comfort: comfort_car.png
    business: business_car.png
    luxury: luxury_car.png

