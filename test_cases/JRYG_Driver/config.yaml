# ==================== 司机端-即时指派流程 ====================
# 接口: GET  /v3/place/text                 (获取即时订单终点位置经纬度)
#       POST /v4/driver/device-check        (设备检测)

test_cases:
  - name: "TC-045 获取即时订单终点位置经纬度"
    description: "通过高德地图 POI 搜索，根据关键字获取终点位置的经纬度"
    priority: "P0"
    method: GET
    base_url: "https://restapi.amap.com"
    path: "/v3/place/text"
    need_login: false
    params:
      key: "8354764cafab49731492c39c0a1899e5"
      city: "北京"
      keywords: "${Instant_Select_End_Poi}"
    asserts:
      - type: status_code
        expected: 200
      - type: json_path
        path: "status"
        expected: "1"
      - type: json_path
        path: "pois.0.location"
        expected: ".+"

