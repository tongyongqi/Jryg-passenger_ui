# ==================== 个人中心分类（P2）====================
# 前置条件: 需要登录

test_cases:
  - name: "TC-001 查看隐私协议是否更新"
    description: "已登录，检查隐私协议是否有更新"
    priority: "P2"
    method: GET
    path: "/v3/user/privacy_agreement/check"
    need_login: true
    params:
      nonce: "${Data_Time}"
    asserts:
      - type: status_code
        expected: 200
      - type: json_path
        path: "code"
        operator: "in"
        expected:
          - 10000
          - 10203

  - name: "TC-002 获取优惠卷到期提醒"
