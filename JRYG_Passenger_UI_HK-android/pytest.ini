# 香港Android默认收集六个独立订单场景；离线测试须显式指定tests及文件规则。
[pytest]
testpaths = cases
pythonpath = .
addopts = --import-mode=importlib
python_files = JRYG_test_android_*_order.py
python_classes = Test*
python_functions = test_*
norecursedirs = logs report screenshots data __pycache__ legacy _ios_verified_snapshot iOS-Tagent
